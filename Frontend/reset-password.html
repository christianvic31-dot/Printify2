<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Printify</title>
    <link rel="stylesheet" href="css/forget-password.css">
</head>
<body>
<main class="forgot-container" style="max-width:420px;margin:60px auto;padding:24px;">
    <h1>Set a new password</h1>
    <p id="resetMessage" role="alert"></p>
    <form id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" required>
        <small>At least 8 characters with uppercase, lowercase, a number and a symbol.</small>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required>
        <button type="submit" id="resetButton">Update password</button>
    </form>
    <p><a href="login.html">Back to login</a></p>
</main>
<script>
(function () {
    var token = new URLSearchParams(window.location.search).get("token") || "";
    var message = document.getElementById("resetMessage");
    var form = document.getElementById("resetForm");
    var button = document.getElementById("resetButton");

    if (!token) {
        message.textContent = "This reset link is missing its token. Request a new one.";
        form.style.display = "none";
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = document.getElementById("newPassword").value;

        if (password !== document.getElementById("confirmPassword").value) {
            message.textContent = "The passwords do not match.";
            return;
        }

        button.disabled = true;
        message.textContent = "Saving...";

        fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, password: password })
        }).then(function (response) {
            return response.json().then(function (data) { return { ok: response.ok, data: data }; });
        }).then(function (result) {
            message.textContent = result.data.message || (result.ok ? "Password updated." : "Unable to reset the password.");
            if (result.ok) setTimeout(function () { window.location.href = "login.html"; }, 1500);
            else button.disabled = false;
        }).catch(function () {
            message.textContent = "Unable to reach the server.";
            button.disabled = false;
        });
    });
})();
</script>
</body>
</html>
